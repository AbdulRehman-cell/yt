version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-app:1.0.0
    container_name: yt-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/yt
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - yt-network

  mongo:
    image: mongo:7.0.14
    container_name: yt-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: yt
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yt-network

  # Optional cache layer — uncomment if the app adds Redis-backed sessions/caching
  # redis:
  #   image: redis:7.2.5-alpine
  #   container_name: yt-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   command: ["redis-server", "--appendonly", "yes"]
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - yt-network

networks:
  yt-network:
    driver: bridge

volumes:
  mongo-data:
  # redis-data: