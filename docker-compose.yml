services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-app:1.0.0
    container_name: yt-app
    restart: unless-stopped
    ports:
      - "10000:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      MONGO_URI: mongodb://mongo:27017/yt
      CLIENT_ORIGIN: http://localhost:10000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - yt-net

  mongo:
    image: mongo:7.0.12
    container_name: yt-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: yt
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yt-net

volumes:
  mongo-data:

networks:
  yt-net:
    driver: bridge