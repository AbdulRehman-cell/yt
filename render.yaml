# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: connect repo in Render dashboard -> "New Blueprint Instance"

services:
  - type: web
    name: yt-app
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true