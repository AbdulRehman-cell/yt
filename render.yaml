services:
  - type: web
    name: yt-app
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
    # If you prefer Render's managed Postgres/Mongo alternative, use an external
    # MongoDB Atlas cluster and paste its connection string as MONGO_URI in the dashboard.

# Optional: Render-managed Redis (uncomment if the app needs caching/queues)
# services:
#   - type: redis
#     name: yt-redis
#     plan: starter
#     ipAllowList: []