name: CI/CD - Build, Test, Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20.11.1"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install client dependencies
        run: npm --prefix client ci --no-audit --no-fund
        continue-on-error: false

      - name: Run server tests (if present)
        run: npm test --if-present

      - name: Run client tests (if present)
        run: npm --prefix client test --if-present

      - name: Build client
        run: npm run build

      - name: Build Docker image (validation only)
        run: docker build -t yt-app:ci-${{ github.sha }} .

  deploy:
    name: Deploy to Render
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"